[package]
name = "overnight"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "overnight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
chrono = { version = "0.4.45", features = ["serde"] }
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSDate", "NSDateFormatter", "NSFormatter", "NSString"] }
sysinfo = "0.40.0"
libc = "0.2.191"
base64 = "0.23.1"
core-foundation = "0.10.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
